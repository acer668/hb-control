<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HB Control</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>♫ HB Control</h1><p>Discord audio network</p></div><div id="loginArea"><button id="loginButton">Sign in</button></div></header><main><section class="summary"><div><strong id="total">0</strong><span>Total bots</span></div><div><strong id="online">0</strong><span>Online</span></div><div><strong id="playing">0</strong><span>Playing</span></div></section><div class="toolbar"><h2>Bot fleet</h2><button id="add" hidden>+ Add bot</button></div><div id="notice" role="status"></div><section id="bots" class="cards"></section></main><dialog id="loginDialog"><form id="loginForm"><h2>Control access</h2><p>Sign in to control audio. Owner access is required to manage tokens and bots.</p><label>Password<input id="password" type="password" required autocomplete="current-password"></label><div class="buttons"><button type="button" data-close>Cancel</button><button type="submit">Sign in</button></div></form></dialog><dialog id="addDialog"><form id="addForm"><h2>Add Discord bot</h2><label>Bot ID<input name="id" placeholder="005" maxlength="24" required></label><label>Display name<input name="label" placeholder="Hell Bot 5" required></label><label>Discord bot token<input name="token" type="password" required autocomplete="off"></label><p>Create the application in the Discord Developer Portal and invite it to the server first.</p><div class="buttons"><button type="button" data-close>Cancel</button><button type="submit">Add bot</button></div></form></dialog><script src="config.js"></script><script src="app.js"></script></body></html>
